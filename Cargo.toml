[package]
name = "polyglot"
version = "0.5.0"
edition = "2024"
rust-version = "1.96"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "polyglot"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb-neo = { version = "=0.20000.1", default-features = false, features = ["build-extension"] }
duckdb-loadable-macros = { version = "1.20000.1", features = ["neo"] }
polyglot-sql = "0.13.5"
serde_json = "1"
